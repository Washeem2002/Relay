spring:
  datasource:
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  data:
    redis:
      timeout: 1000ms

sluice:
  admin:
    token: test-admin-token
  security:
    api-key-secret: integration-test-api-key-secret
    max-request-body-bytes: 1048576
  config:
    poll-interval-ms: 60000
  gateway:
    health-tick-ms: 100
    canary-eval-interval-ms: 200
    retired-pool-grace-ms: 5000

logging:
  level:
    root: WARN
    sluice.access: WARN
